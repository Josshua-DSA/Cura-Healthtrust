name: Data Pipeline CI & Quality Gates

on:
  push:
    branches: [ main, joshua, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-data-pipeline:
    name: Run Unit Tests & Data Quality Gates
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: cura_db
          POSTGRES_USER: cura_user
          POSTGRES_PASSWORD: cura_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r database/requirements.txt

      - name: Initialize Database Schema & Spatial Indexes
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: cura_db
          DB_USER: cura_user
          DB_PASSWORD: cura_password
        run: |
          PYTHONPATH=database python database/cli.py init-db
          PYTHONPATH=database python database/cli.py seed-wilayah
          PYTHONPATH=database python database/cli.py run-etl

      - name: Run Test Suite (25 Tests / Data Quality Gates)
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: cura_db
          DB_USER: cura_user
          DB_PASSWORD: cura_password
        run: |
          PYTHONPATH=database pytest database/tests/ -v --tb=short
