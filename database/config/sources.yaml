sources:
  - id: sirs_kemenkes_list
    name: "SIRS Kemenkes Data RS & Koordinat Jatim"
    type: rest_api
    base_url: "https://sirs.kemkes.go.id/fo/home/list_prop_noncovid?id=35"
    auth: none
    format: json
    license: "Publik - Kemenkes RI"
    update_frequency: weekly
    description: "Data 447+ RS Jawa Timur lengkap dengan kode, nama, alamat, telepon, kelas, jenis, dan koordinat lat/lng."

  - id: sirs_kemenkes_rekap
    name: "SIRS Kemenkes Rekap RS Jatim"
    type: rest_api
    base_url: "https://sirs.kemkes.go.id/fo/home/rekap_rs_all?id=35"
    auth: none
    format: json
    license: "Publik - Kemenkes RI"
    update_frequency: weekly
    description: "Data kepemilikan/pemilik RS, kelas, jenis, dan kabupaten di Jawa Timur."

  - id: sirs_kemenkes_rasio_tt
    name: "SIRS Kemenkes Rasio Tempat Tidur Wilayah"
    type: rest_api
    base_url: "https://sirs.kemkes.go.id/fo/mapgeo/rasio_tt?id=35"
    auth: none
    format: json
    license: "Publik - Kemenkes RI"
    update_frequency: daily
    description: "Rasio tempat tidur per 1.000 penduduk per 38 Kab/Kota Jawa Timur beserta status kelayakan WHO."

  - id: sirs_kemenkes_rekap_jenis
    name: "SIRS Kemenkes Rekap Jenis RS Jatim"
    type: rest_api
    base_url: "https://sirs.kemkes.go.id/fo/home/rekap_by_jenis?id=35"
    auth: none
    format: json
    license: "Publik - Kemenkes RI"
    update_frequency: weekly
    description: "Distribusi tipe spesialisasi rumah sakit di Jawa Timur."

  - id: sirs_kemenkes_geojson
    name: "SIRS Kemenkes GeoJSON Wilayah & Penduduk Jatim"
    type: rest_api
    base_url: "https://sirs.kemkes.go.id/fo/mapgeo/koordinat?id=35&mapfile=json%2Fprovinsi.json"
    auth: none
    format: geojson
    license: "Publik - Kemenkes RI"
    update_frequency: monthly
    description: "Polygon batas 38 kab/kota di Jatim beserta kode BPS dan jumlah penduduk."

  - id: opendata_jatim
    name: "Open Data Pemprov Jatim API"
    type: rest_api
    base_url: "https://opendata.jatimprov.go.id/api/datasets"
    auth: none
    delay_seconds: 2
    headers:
      User-Agent: "Mozilla/5.0 (HealthTrust Research Project)"
    license: "Open Government - UU KIP No.14/2008"
    update_frequency: quarterly

  - id: bps_jatim
    name: "BPS Provinsi Jawa Timur"
    type: manual_csv
    base_url: "https://jatim.bps.go.id"
    headers:
      User-Agent: "Mozilla/5.0 (HealthTrust Research Project)"
    license: "BPS Attribution"
    update_frequency: annual

  - id: geojson_jatim_github
    name: "GeoJSON Batas Wilayah Jatim (Backup)"
    type: github_download
    url: "https://raw.githubusercontent.com/carissafarry/JatimGeoJSON/master/GeoJSON/Jawa_Timur.json"
    format: geojson
    license: "MIT"
    update_frequency: once
